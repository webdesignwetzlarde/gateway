version = 1
SPDX-PackageName = "kopist"
SPDX-PackageSupplier = "The Kopist Authors"
SPDX-PackageDownloadLocation = "https://github.com/kwdwetz/gateway"

# Default: everything is Apache-2.0.
# If several annotations match a file, the last matching one applies.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Kopist Authors"
SPDX-License-Identifier = "Apache-2.0"

# Documentation and specification prose: CC-BY-4.0.
[[annotations]]
path = ["docs/**", "spec/**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Kopist Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Adapted from the Contributor Covenant 2.1.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["2014-2021 Coraline Ada Ehmke and Contributor Covenant contributors", "2026 The Kopist Authors"]
SPDX-License-Identifier = "CC-BY-4.0"
